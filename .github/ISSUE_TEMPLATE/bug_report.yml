name: 🐛 Bug report
description: Something does not work as expected.
title: "bug: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](https://github.com/fabiovincenzi/fairhour/issues) first.
        **Security problems must be reported privately** (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Desktop app
        - Public API / webhooks
        - Tax computation
        - Reports / exports
        - Self-hosting / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Fairhour version or commit (Settings → About, or the Docker image tag).
      placeholder: "0.4.0 / ghcr.io/fabiovincenzi/fairhour:0.4.0 / main@abc123"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted (Docker)
        - Self-hosted (other)
        - Local development
        - Desktop app
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, locale and time zone (time zones matter for time tracking bugs).
      placeholder: "Firefox 140 on macOS 26, locale it-IT, Europe/Rome"
  - type: textarea
    id: tax
    attributes:
      label: Tax computation details (if relevant)
      description: Tax pack, regime and configuration, input amounts, the result you got and the result you expected. Remove personal data.
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant log output (remove secrets and personal data) or screenshots.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
