name: 🌍 Translation request
description: Translate Fairhour into a new language or improve a translation.
title: "i18n: <language>"
labels: ["translation", "area: i18n", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! See the [translation guide](https://github.com/fabiovincenzi/fairhour/blob/main/docs/contributing/translations.md).
  - type: input
    id: locale
    attributes:
      label: Locale (BCP 47)
      placeholder: "de, fr, pt-BR"
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - Web app
        - Desktop app
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Request type
      options:
        - New language
        - Improve an existing translation
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Terminology questions, regional variants, or the strings you want to fix.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I will translate it myself.
