name: ✨ Feature request
description: Suggest an idea or an improvement.
title: "feat: "
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! For open-ended brainstorming, [Discussions](https://github.com/fabiovincenzi/fairhour/discussions) may be a better place.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who has it?
      placeholder: "As a freelancer who … I want … so that …"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Fairhour to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Time tracking
        - Clients / projects / rates
        - Tax computation
        - Reports / exports
        - Desktop app
        - Public API / webhooks
        - Self-hosting
        - Accessibility
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
