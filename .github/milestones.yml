# Milestones, one per roadmap phase. Synced by .github/workflows/sync-backlog.yml.
# `title` is the stable key: renaming a milestone here creates a new one on GitHub.

- title: "v0.1 Foundation"
  description: "Phases 0-1: AI dev setup, governance, backlog-as-code, CI, monorepo tooling, docs site skeleton."
- title: "v0.2 Core & Tax Engine"
  description: "Phase 2: money, time math, rates, the TaxPack engine, Italy and generic packs, conformance suite."
- title: "v0.3 Data & Auth"
  description: "Phase 3: PostgreSQL schema, migrations, seed, auth, workspaces and roles, tenant isolation."
- title: "v0.4 Web MVP"
  description: "Phase 4: CRUD, timer, entries list and calendar, rates, invoice computation screen, en + it."
- title: "v0.5 Reports"
  description: "Phase 5: dashboards, charts, PDF/CSV exports, signed share links."
- title: "v0.6 Hardening"
  description: "Phase 6: E2E, accessibility, security headers, rate limiting, performance."
- title: "v0.7 Public API & Webhooks"
  description: "Phase 7: public REST API with OpenAPI, personal access tokens, outgoing webhooks."
- title: "v0.8 Self-hosting & Releases"
  description: "Phase 8: production compose, GHCR images, release pipeline, self-hosting guide."
- title: "v0.9 Desktop Companion"
  description: "Phase 9: Tauri tray timer, idle detection, private activity suggestions."
- title: "v0.10 FatturaPA"
  description: "Phase 10: FatturaPA (FPR12) XML export validated against the official XSD."
- title: "v1.0 Launch"
  description: "Phase 11: launch polish, demo data, docs pass, roadmap, launch checklist."
