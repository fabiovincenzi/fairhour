  - id: REV-010
    title: "i18n check: report parse errors that carry no position"
    type: bug
    areas: [i18n, infra]
    priority: P1
    size: S
    status: ready
    state: done
    body: |
      `scripts/i18n/src/locales.ts` assumes every FormatJS parse error has a `location`, but number
      and date skeletons throw a plain RangeError (`{d, date, ::YYYY}`, `{n, number, ::.00/w/x}`),
      which crashes the checker. Also add `pnpm-lock.yaml`, `package.json` and
      `.github/actions/setup/**` to the `paths` of `.github/workflows/i18n.yml`, and describe
      `pnpm i18n:check` everywhere as "every locale has every English key, every message is valid
      ICU and placeholders/tags match".

      Files: `scripts/i18n/**`, `.github/workflows/i18n.yml`, `CONTRIBUTING.md`,
      `apps/docs/src/content/docs/getting-started/quickstart.md`. Owner: `implementer`.
    acceptance:
      - "Errors without a location are reported as `<name>: <message>`; table tests for both examples"
      - "`actionlint` passes"

  - id: REV-011
    title: "Lint guards: close purity and money-safety gaps"
    type: chore
    areas: [infra]
    priority: P2
    size: S
    status: ready
    body: |
      In MIT packages, `import process from "node:process"`, `import { randomUUID } from "node:crypto"`,
      `import { performance } from "node:perf_hooks"`, `globalThis.Date.now()`, `new globalThis.Date()`,
      `globalThis.Math.random()` and `globalThis.Number(x)` are lint-clean. Extend the `mitLibrary`
      and `moneySafety` options of `packages/config/eslint.js` (keep the `@fairhour/*` import pattern:
      `no-restricted-imports` options replace each other), add fixture tests, and correct the README
      claim that every MIT package has a `purity.test.ts`.

      Files: `packages/config/**`. Owner: `implementer`.
    acceptance:
      - "Fixture tests for each bypass; money, tax-core and every tax pack still lint clean"

  - id: REV-012
    title: "core: make the overlaps complexity test catch a realistic quadratic regression"
    type: chore
    areas: [core]
    priority: P3
    size: S
    status: ready
    body: |
      At 2k vs 16k entries the per-entry ISO parsing dilutes the quadratic signal: a realistic O(n²)
      implementation measured a ratio of 35–39 against a bound of 30. Widen the size ratio (e.g. 1k vs
      16k with a bound ~40) or lower the bound, so a quadratic regression fails with ~2× headroom on
      both sides, and correct the comments.

      Files: `packages/core/src/entries/overlaps.test.ts`. Owner: `implementer` or `test-writer`.
    acceptance:
      - "Measured ratios for the real and a quadratic implementation are reported in the PR"

  - id: REV-013
    title: "Read the primary legal texts and upgrade source verification grades"
    type: docs
    areas: [tax-pack-it, tax-packs]
    priority: P2
    size: M
    status: blocked
    labels: ["help wanted", "agent: human"]
    depends_on: [REV-005, REV-007]
    body: |
      The automated research could not open Normattiva or EUR-Lex, so several sources of the Italian
      and generic packs are graded secondary or "to be verified" (see `docs/tax-packs/it.md` §14 and
      `docs/tax-packs/generic.md` §2.5). A person (or an agent with web access) should read the
      primary texts and upgrade each grade, or correct the rule when the text disagrees.

      Files: `packages/tax-pack-it/src/sources.ts`, `packages/tax-pack-generic/src/sources.ts`,
      the two docs. Owner: a maintainer with the `architect` agent.
    acceptance:
      - "Every [TBV]/secondary source either upgraded with the primary citation or explained"
      - "Any rule change comes with updated golden fixtures"
