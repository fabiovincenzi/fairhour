# picked up by any agent in parallel: the "Files" line lists the only files the work should touch.
milestone: "v0.2 Core & Tax Engine"
items:
  - id: REV-001
    title: "Epic: phase 2 review follow-ups"
    type: epic
    areas: [tax-core, tax-packs, core]
    priority: P1
    size: L
    status: ready
    children:
      [
        REV-002,
        REV-003,
        REV-004,
