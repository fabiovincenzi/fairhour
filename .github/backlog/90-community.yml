    size: S
    status: ready
    labels: ["good first issue"]
    depends_on: [WEB-006]
    body: |
      Pressing `?` opens a dialog listing every keyboard shortcut, generated from the shortcut
      registry so it never gets out of date.
    acceptance:
      - "Accessible dialog (focus trap, `Escape` closes, labelled)"
      - "Strings translated in `en` and `it`"

