    type: feature
    areas: [core]
    priority: P3
    size: S
    status: ready
    labels: ["good first issue"]
    depends_on: [CORE-002]
    body: |
      The currency table covers the most common currencies. Add the remaining active ISO 4217
      codes with their minor-unit exponents.
    acceptance:
      - "Table generated or checked against the ISO 4217 list, with a test for exponents 0, 2 and 3"

  - id: GFI-016
    title: "Country flags in the tax pack selector"
    type: feature
    areas: [web, ui]
    priority: P3
    size: S
    status: ready
    labels: ["good first issue"]
    depends_on: [WEB-008]
    body: |
      Show each pack's country flag (emoji from the ISO code) next to its name, with an
      accessible label.
    acceptance:
