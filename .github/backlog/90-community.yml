  # --- Tax packs ------------------------------------------------------------------
  - id: GFI-007
    title: "Tax pack: Germany, Kleinunternehmerregelung (§ 19 UStG) and standard VAT"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      German freelancers either apply VAT (19% standard, 7% reduced) or use the small-business
      exemption of § 19 UStG with the mandatory note on the invoice. Start from
      `packages/tax-pack-template` and follow [docs/contributing/tax-packs.md](../../docs/contributing/tax-packs.md),
      or run `/new-tax-pack de` with Claude Code.
    acceptance:
      - "Regimes: Regelbesteuerung (19%/7%) and Kleinunternehmer (§ 19 UStG note, no VAT)"
      - "Thresholds versioned by effective date with sources (they changed on 2025-01-01)"
      - "Conformance suite passes; golden fixtures for both regimes; `docs/tax-packs/de.md`"

  - id: GFI-008
    title: "Tax pack: France, micro-entrepreneur (franchise en base de TVA)"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      Micro-entrepreneurs under the VAT franchise must print "TVA non applicable, art. 293 B du
      CGI". Others charge VAT (20% standard). Start from the template and follow
      [docs/contributing/tax-packs.md](../../docs/contributing/tax-packs.md).
    acceptance:
      - "Regimes: franchise en base (mention art. 293 B CGI) and TVA 20%/10%/5.5%"
      - "Sources for each rule; conformance suite passes; `docs/tax-packs/fr.md`"

  - id: GFI-009
    title: "Tax pack: Spain, autónomo (IVA + IRPF withholding)"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      Spanish professionals charge IVA (21% standard) and, when invoicing businesses, the client
      withholds IRPF (15%, or a reduced rate for new professionals). Start from the template.
    acceptance:
      - "IVA rate and IRPF withholding (standard and reduced) configurable, versioned by date"
      - "Sources for each rule; conformance suite passes; `docs/tax-packs/es.md`"

  - id: GFI-010
    title: "Tax pack: Portugal, trabalhador independente"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      Independent workers charge IVA (23% on the mainland) or use the small-business exemption
      (art. 53 CIVA), and business clients may withhold IRS. Research the current rates and
      thresholds with sources. Start from the template.
    acceptance:
      - "Exemption wording, IVA rates by region (mainland, Madeira, Azores) and withholding configurable"
      - "Sources for each rule; conformance suite passes; `docs/tax-packs/pt.md`"

  - id: GFI-011
    title: "Tax pack: United Kingdom, sole trader (VAT registered or not)"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      Sole traders above the VAT registration threshold charge VAT (20% standard); others do not.
      Track turnover against the threshold. Start from the template.
    acceptance:
      - "VAT registered / not registered; registration threshold versioned by date with sources"
      - "Conformance suite passes; `docs/tax-packs/gb.md`"

  - id: GFI-012
    title: "Tax pack: Netherlands, KOR (kleineondernemersregeling) and BTW"
    type: feature
    areas: [tax-packs]
    priority: P3
    size: M
    status: ready
    labels: ["good first issue", "help wanted", "tax-pack-request"]
    depends_on: [TAX-009]
    body: |
      Dutch freelancers charge BTW (21%/9%) or opt into the KOR exemption with the required
      invoice note. Start from the template.
    acceptance:
      - "Regimes: BTW and KOR, thresholds versioned with sources"
      - "Conformance suite passes; `docs/tax-packs/nl.md`"

  # --- Small product improvements -----------------------------------------------
  - id: GFI-013
