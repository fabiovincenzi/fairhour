  - id: GFI-017
    title: "Copy-to-clipboard for amounts on the invoice computation screen"
    type: feature
    areas: [web]
    priority: P3
    size: S
    status: ready
    labels: ["good first issue"]
    depends_on: [WEB-007]
    body: |
      Each amount gets a small copy button so users can paste figures into their invoicing tool.
    acceptance:
