    depends_on: [WEB-003]
    body: |
      When picking a client currency, preview how amounts will look (e.g. `CHF 1’234.50`) using
      `formatMoney` from `@fairhour/money` and the user's locale.
    acceptance:
      - "Preview updates as the currency changes; covered by a component test"

