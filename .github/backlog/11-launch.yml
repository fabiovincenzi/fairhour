milestone: "v1.0 Launch"
items:
  - id: LAUNCH-001
    title: "Epic: launch"
    type: epic
    areas: [docs]
    priority: P1
    size: L
    status: ready
    children: [LAUNCH-002, LAUNCH-003, LAUNCH-004, LAUNCH-005]
    body: |
      Phase 11. Make the first impression great.
    acceptance:
      - All sub-issues are done

  - id: LAUNCH-002
    title: "README polish with screenshots and demo"
    type: docs
    areas: [docs]
    priority: P1
    size: S
    status: ready
    body: |
      Real screenshots (light and dark), a short GIF of the timer → invoice flow, up-to-date badges.
    acceptance:
      - "Screenshots generated by a Playwright script so they stay current"

  - id: LAUNCH-003
    title: "Demo data and public demo instructions"
    type: feature
    areas: [db, docs]
    priority: P2
    size: S
    status: ready
    depends_on: [DATA-005]
    body: |
      A demo mode seed and docs on running a public demo that resets nightly.
    acceptance:
      - "`DEMO_MODE=true` disables destructive settings and email"

  - id: LAUNCH-004
    title: "ROADMAP.md and launch checklist"
    type: docs
    areas: [docs]
    priority: P1
    size: S
    status: ready
    body: |
      Public roadmap and `docs/maintainers/launch.md` with Show HN, Product Hunt and
      awesome-selfhosted submission notes.
    acceptance:
      - "Roadmap links milestones and explains how to propose items"

  - id: LAUNCH-005
    title: "Documentation pass"
    type: docs
    areas: [docs]
    priority: P1
    size: M
    status: ready
    body: |
      Read every page as a newcomer: fix gaps, broken links and outdated screenshots.
    acceptance:
      - "Link checker passes in CI"
      - "Every feature has a user guide page"
