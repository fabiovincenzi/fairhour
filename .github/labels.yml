# Label taxonomy. Synced to GitHub by .github/workflows/sync-backlog.yml.
# Labels that exist on GitHub but not here are left untouched (never deleted).
# See docs/maintainers/labels.md for meanings and usage.

# --- Type -------------------------------------------------------------------
- name: "type: bug"
  color: "d73a4a"
  description: "Something is not working as intended"
- name: "type: feature"
  color: "a2eeef"
  description: "New functionality or an improvement to an existing feature"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, dependencies, CI"
- name: "type: refactor"
  color: "fef2c0"
  description: "Code change that neither fixes a bug nor adds a feature"
- name: "type: security"
  color: "b60205"
  description: "Security hardening or vulnerability fix (report vulnerabilities privately!)"
- name: "type: epic"
  color: "3e4b9e"
  description: "Tracks a group of related issues through a task list"

# --- Area -------------------------------------------------------------------
- name: "area: web"
  color: "1d76db"
  description: "apps/web (Next.js app, PWA)"
- name: "area: desktop"
  color: "1d76db"
  description: "apps/desktop (Tauri companion)"
- name: "area: api"
  color: "1d76db"
  description: "packages/api (tRPC, public REST, webhooks)"
- name: "area: db"
  color: "1d76db"
  description: "packages/db (schema, migrations, seed, repositories)"
- name: "area: core"
  color: "1d76db"
  description: "packages/core and packages/money (time math, rates, budgets, money)"
- name: "area: tax-core"
  color: "5319e7"
  description: "packages/tax-core (engine, TaxPack interface, conformance suite)"
- name: "area: tax-pack-it"
  color: "5319e7"
  description: "packages/tax-pack-it (Italy)"
- name: "area: tax-packs"
  color: "5319e7"
  description: "Other tax packs (generic, template, community countries)"
- name: "area: i18n"
  color: "1d76db"
  description: "Translations, locale files, formatting"
- name: "area: docs"
  color: "1d76db"
  description: "apps/docs, docs/, READMEs"
- name: "area: infra"
  color: "1d76db"
  description: "CI/CD, Docker, release pipeline, repo automation"
- name: "area: ui"
  color: "1d76db"
  description: "packages/ui design system and accessibility"
- name: "area: reports"
  color: "1d76db"
  description: "Dashboards, charts, PDF/CSV exports, share links"

# --- Priority ---------------------------------------------------------------
- name: "P0"
  color: "b60205"
  description: "Critical: drop everything (data loss, security, broken main)"
- name: "P1"
  color: "d93f0b"
  description: "High: needed for the current milestone"
- name: "P2"
  color: "fbca04"
  description: "Medium: important but can wait"
- name: "P3"
  color: "c5def5"
  description: "Low: nice to have"

# --- Status -----------------------------------------------------------------
- name: "status: triage"
  color: "ededed"
  description: "Needs a maintainer to triage"
- name: "status: ready"
  color: "0e8a16"
  description: "Scoped and ready to be picked up"
- name: "status: blocked"
  color: "e99695"
  description: "Waiting on something else (see the issue)"
- name: "status: in-progress"
  color: "fbca04"
  description: "Someone is working on it"

# --- Size -------------------------------------------------------------------
- name: "size: S"
  color: "c2e0c6"
  description: "A few hours"
- name: "size: M"
  color: "bfdadc"
  description: "One to three days"
- name: "size: L"
  color: "bfd4f2"
  description: "About a week"
- name: "size: XL"
  color: "d4c5f9"
  description: "More than a week; consider splitting"

# --- Community --------------------------------------------------------------
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers: small, self-contained, well documented"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed; contributions welcome"
- name: "tax-pack-request"
  color: "5319e7"
  description: "Request or proposal for a new country tax pack"
- name: "translation"
  color: "f9d0c4"
  description: "Translation of the UI or docs into a new language"

# --- Housekeeping -----------------------------------------------------------
- name: "pinned"
  color: "000000"
  description: "Never marked stale"
- name: "stale"
  color: "ffffff"
  description: "No activity for a while; will be closed unless updated"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Renovate)"
- name: "first-time contributor"
  color: "7057ff"
  description: "Opened by someone contributing for the first time"
- name: "needs-dco"
  color: "e11d21"
  description: "One or more commits are missing a DCO sign-off"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
- name: "question"
  color: "d876e3"
  description: "Better asked in Discussions"
