name: Docker

# Builds the production image for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/fabiovincenzi/fairhour. Called by release.yml with a version; on manual runs it
# publishes an `edge` image from the selected ref. Generates an SPDX SBOM and a build
# provenance attestation.

on:
  workflow_call:
    inputs:
      version:
        description: Released version of @fairhour/web (e.g. 0.8.0)
        type: string
        required: true
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=edge,enable=${{ inputs.version == '' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Fairhour
            org.opencontainers.image.description=Open-source time tracking that tells you exactly what to invoice
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: fairhour-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach SBOM to the release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "@fairhour/web@${{ inputs.version }}"
        run: gh release upload "$TAG" fairhour-sbom.spdx.json --clobber --repo "$GITHUB_REPOSITORY"
