name: Add to roadmap board

# Optional: adds new issues to a GitHub Projects v2 board.
# Requires the repository secret PROJECT_TOKEN (a PAT with the `project` scope) and the
# repository variable PROJECT_URL (e.g. https://github.com/users/fabiovincenzi/projects/1).
# Without them the job succeeds without doing anything. See docs/maintainers/project-board.md.

on:
  issues:
    types: [opened, transferred]

permissions: {}

jobs:
  add:
    name: Add issue to project
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check configuration
        id: config
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
        run: |
          if [ -n "$PROJECT_TOKEN" ] && [ -n "$PROJECT_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PROJECT_TOKEN or PROJECT_URL is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        if: steps.config.outputs.enabled == 'true'
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
