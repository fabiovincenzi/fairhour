name: PR title

on:
  # pull_request_target so the check also works for PRs from forks. The workflow never checks
  # out or runs PR code; it only reads the title.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  semantic-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lowercase letter,
            e.g. "feat(core): add 6-minute rounding".
