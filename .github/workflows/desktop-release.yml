name: Desktop release

# Builds the Tauri desktop companion for macOS (Apple silicon + Intel), Windows and Linux and
# attaches the bundles to the GitHub Release of @fairhour/desktop. Called by release.yml or run
# manually (draft release). Code signing is optional: when the secrets below are missing,
# unsigned bundles are produced. See docs/maintainers/release-process.md#desktop-signing.
#
# Optional secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (macOS signing + notarization),
# WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD (Windows Authenticode),
# TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater signatures).

on:
  workflow_call:
    inputs:
      version:
        description: Released version of @fairhour/desktop
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (creates/updates a draft release)
        type: string
        required: true

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows x64
            os: windows-latest
            args: ""
            rust-targets: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - uses: ./.github/actions/setup
      - name: Build and attach bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: "@fairhour/desktop@${{ inputs.version }}"
          releaseName: "Fairhour Desktop ${{ inputs.version }}"
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          args: ${{ matrix.args }}
